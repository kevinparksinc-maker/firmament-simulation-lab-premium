name: Firmament validation
on:
  push:
    branches:
      - 'audit/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-save --package-lock=false
        # Temporary CI-only workaround: existing npm lockfile is out of sync and
        # Builder JSX-location plugin declares older Vite peer dependencies.
        # Regenerate and commit a valid lockfile before switching back to npm ci.
      - name: Typecheck
        run: npm run check
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
